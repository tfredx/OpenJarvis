name: OpenJarvisMobile
options:
  bundleIdPrefix: org.openjarvis.mobileprototype
  deploymentTarget:
    iOS: '27.0'
packages:
  JarvisCore:
    path: ..
targets:
  OpenJarvisMobile:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: JarvisCore
        product: JarvisCore
      - framework: Frameworks/OpenJarvisBridge.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openjarvis.mobileprototype.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jarvis
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.3.2
        CURRENT_PROJECT_VERSION: 5
        SWIFT_VERSION: 6.0
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) REQUIRE_RUST_BRIDGE"
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
  OpenJarvisMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OpenJarvisMobile
      - package: JarvisCore
        product: JarvisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openjarvis.mobileprototype.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
schemes:
  OpenJarvisMobile:
    build:
      targets:
        OpenJarvisMobile: all
        OpenJarvisMobileTests: [test]
    test:
      targets:
        - OpenJarvisMobileTests
