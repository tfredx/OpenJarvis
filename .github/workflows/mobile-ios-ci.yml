name: Mobile iOS CI
on:
  pull_request:
    branches: [ios/main]
  push:
    branches: [ios/main, chore/ios-portable-ci]
permissions:
  contents: read
concurrency:
  group: mobile-ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Mobile portable Swift tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native_present: ${{ steps.source.outputs.present }}
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: swift --version
      - name: Run portable tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/mobile-swift-test.log
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' /tmp/mobile-swift-test.log
      - name: Detect native baseline
        id: source
        run: |
          if [[ -f bridge/Cargo.toml && -f ios/project-native.yml && -x scripts/build-rust-bridge.sh ]]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo present=false >> "$GITHUB_OUTPUT"
            echo "::notice::Native baseline not yet present in this commit; native build will be skipped."
          fi
  native:
    name: Mobile native iOS build
    needs: portable
    if: needs.portable.outputs.native_present == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify SDK and install build prerequisites
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ ${sdk%%.*} -ge 27 ]]
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version
          rustup --version
          rustup toolchain install stable --profile minimal
          cargo +stable --version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
      - name: Run upstream bridge host tests and cross-build
        run: ./scripts/build-rust-bridge.sh
      - name: Generate native-required project
        working-directory: mobile/ios/ios
        run: xcodegen generate --spec project-native.yml
      - name: Unsigned device build
        run: |
          xcodebuild -project ios/OpenJarvisMobile.xcodeproj -scheme OpenJarvisMobile \
            -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath .ios-build/device build
      - name: Unsigned simulator build
        run: |
          xcodebuild -project ios/OpenJarvisMobile.xcodeproj -scheme OpenJarvisMobile \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath .ios-build/simulator build
      - name: Record resolved lockfile hash
        if: always()
        run: |
          if [[ -f bridge/Cargo.lock ]]; then shasum -a 256 bridge/Cargo.lock; fi
