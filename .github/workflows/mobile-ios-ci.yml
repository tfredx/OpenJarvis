name: Mobile iOS CI
on:
  pull_request:
    branches: [ios/main]
  push:
    branches: [ios/main]
    tags: ['ios-v*']
permissions:
  contents: read
concurrency:
  group: mobile-ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Mobile portable Swift tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: swift --version
      - name: Validate build scripts and symbol checks
        run: ./scripts/test-build-scripts.sh
      - name: Verify system SQLite development headers
        run: |
          if ! pkg-config --exists sqlite3; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev pkg-config
          fi
          pkg-config --modversion sqlite3
      - name: Run portable tests
        run: |
          set -o pipefail
          mkdir -p audit
          swift test 2>&1 | tee audit/swift-test.log
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' audit/swift-test.log
      - name: Verify complete native baseline
        run: |
          test -f bridge/Cargo.toml
          test -f ios/project-native.yml
          test -x scripts/build-rust-bridge.sh
      - name: Retain portable diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-portable-diagnostics
          path: mobile/ios/audit/swift-test.log
          if-no-files-found: warn
          retention-days: 14
  security:
    name: Existing repository security audit
    uses: ./.github/workflows/security-sast.yml
  native:
    name: Mobile native iOS build
    needs: [portable, security]
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate iOS release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin ios/main
          release_version=$(./scripts/validate-ios-release-tag.sh \
            "$RELEASE_TAG" "$RELEASE_SHA" "$(git rev-parse FETCH_HEAD)")
          echo "IOS_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "IOS_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "IOS_RELEASE_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Verify SDK and install build prerequisites
        run: |
          set -euo pipefail
          mkdir -p audit
          xcodebuild -version | tee audit/xcode-version.txt
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ ${sdk%%.*} -ge 27 ]]
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version
          rustup --version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version | tee audit/xcodegen-version.txt
      - name: Record native memory retrieval benchmark
        run: ./scripts/benchmark-memory-retrieval.sh
      - name: Run native Apple embedding acceptance regression
        run: |
          set -o pipefail
          swift test --filter NativeMemoryEmbeddingTests 2>&1 | tee audit/macos-memory-acceptance.log
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' audit/macos-memory-acceptance.log
      - name: Require a benchmark candidate that passed calibration and holdout
        run: grep -Eq '^candidate (absolute-|confidence-fusion-|word-alignment-)' audit/memory-benchmark.txt
      - name: Run upstream bridge host tests and cross-build
        run: ./scripts/build-rust-bridge.sh
      - name: Generate native-required project
        working-directory: mobile/ios/ios
        run: xcodegen generate --spec project-native.yml
      - name: Unsigned device build
        run: |
          set -o pipefail
          version_args=()
          if [[ -n "${IOS_RELEASE_VERSION:-}" ]]; then
            version_args+=("MARKETING_VERSION=$IOS_RELEASE_VERSION" "CURRENT_PROJECT_VERSION=$IOS_RELEASE_BUILD")
          fi
          xcodebuild -project ios/OpenJarvisMobile.xcodeproj -scheme OpenJarvisMobile \
            -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            "${version_args[@]}" \
            -derivedDataPath .ios-build/device build 2>&1 | tee audit/xcode-device.log
      - name: Compile unsigned simulator host and run hosted integration tests
        run: ./scripts/test-native-integration.sh
      - name: Package verified unsigned app bundles
        run: ./scripts/package-native-builds.sh
      - name: Publish unsigned development build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-unsigned-development-build
          path: mobile/ios/.ios-build/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned unsigned IPA
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenJarvisMobile-${{ env.IOS_RELEASE_TAG }}-unsigned
          path: |
            mobile/ios/.ios-build/packages/OpenJarvisMobile-${{ env.IOS_RELEASE_TAG }}-unsigned.ipa
            mobile/ios/.ios-build/packages/BUILD-MANIFEST.json
            mobile/ios/.ios-build/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Record resolved lockfile hash
        if: always()
        run: |
          if [[ -f bridge/Cargo.lock ]]; then shasum -a 256 bridge/Cargo.lock; fi
      - name: Retain native build diagnostics and resolved lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-native-diagnostics
          path: |
            mobile/ios/audit/
            mobile/ios/bridge/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
