name: Mobile iOS CI
on:
  pull_request:
    branches: [ios/main]
  push:
    branches: [ios/main]
permissions:
  contents: read
concurrency:
  group: mobile-ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Mobile portable Swift tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: swift --version
      - name: Validate build scripts and symbol checks
        run: ./scripts/test-build-scripts.sh
      - name: Verify system SQLite development headers
        run: |
          if ! pkg-config --exists sqlite3; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev pkg-config
          fi
          pkg-config --modversion sqlite3
      - name: Run portable tests
        run: |
          set -o pipefail
          mkdir -p audit
          swift test 2>&1 | tee audit/swift-test.log
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' audit/swift-test.log
      - name: Verify complete native baseline
        run: |
          test -f bridge/Cargo.toml
          test -f ios/project-native.yml
          test -x scripts/build-rust-bridge.sh
      - name: Retain portable diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-portable-diagnostics
          path: mobile/ios/audit/swift-test.log
          if-no-files-found: warn
          retention-days: 14
  native:
    name: Mobile native iOS build
    needs: portable
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify SDK and install build prerequisites
        run: |
          set -euo pipefail
          mkdir -p audit
          xcodebuild -version | tee audit/xcode-version.txt
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ ${sdk%%.*} -ge 27 ]]
          xcrun --sdk iphonesimulator --show-sdk-version
          swift --version
          rustup --version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version | tee audit/xcodegen-version.txt
      - name: Run upstream bridge host tests and cross-build
        run: ./scripts/build-rust-bridge.sh
      - name: Generate native-required project
        working-directory: mobile/ios/ios
        run: xcodegen generate --spec project-native.yml
      - name: Unsigned device build
        run: |
          set -o pipefail
          xcodebuild -project ios/OpenJarvisMobile.xcodeproj -scheme OpenJarvisMobile \
            -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath .ios-build/device build 2>&1 | tee audit/xcode-device.log
      - name: Unsigned simulator build
        run: |
          set -o pipefail
          xcodebuild -project ios/OpenJarvisMobile.xcodeproj -scheme OpenJarvisMobile \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath .ios-build/simulator build 2>&1 | tee audit/xcode-simulator.log
      - name: Run hosted native integration tests
        run: ./scripts/test-native-integration.sh
      - name: Package verified unsigned app bundles
        run: ./scripts/package-native-builds.sh
      - name: Publish unsigned development build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-unsigned-development-build
          path: mobile/ios/.ios-build/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Record resolved lockfile hash
        if: always()
        run: |
          if [[ -f bridge/Cargo.lock ]]; then shasum -a 256 bridge/Cargo.lock; fi
      - name: Retain native build diagnostics and resolved lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-native-diagnostics
          path: |
            mobile/ios/audit/
            mobile/ios/bridge/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
